app = "africamonthly-bot"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"

# No [[services]] / [http_service] — this is a background worker (long-polling),
# it has no inbound HTTP. Without a services block Fly will NOT autostop it,
# so the single machine stays running 24/7.

# Always restart the worker if it ever exits or crashes
[[restart]]
  policy = "always"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
