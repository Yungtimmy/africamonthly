app = "africamonthly-bot"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"

[[services]]
  # No HTTP — pure long-polling bot, no inbound traffic needed
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[checks]
  # Fly restarts the machine if it crashes — min_machines_running = 1 ensures always-on

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
